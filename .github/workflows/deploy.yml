name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys against the same stage at once, and let a running
# deploy finish instead of cancelling it halfway through.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Vite+, Node.js, pnpm and the project dependencies.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true

      # The Paraglide output is gitignored and normally generated by the Vite
      # plugin during a build. Type checking needs it, so generate it first.
      - name: Generate Paraglide messages
        run: vp exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide --strategy url baseLocale --emit-ts-declarations --silent

      - name: Check
        run: vp check

      # Alchemy builds the site itself. In CI it reads Cloudflare credentials
      # from the environment instead of a local profile.
      - name: Deploy
        run: vp exec alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
